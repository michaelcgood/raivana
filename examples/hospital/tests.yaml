tests:
- name: Nurse reads a patient record at 10:00
  request:
    subject:
      role: nurse
    action: read
    resource:
      type: medical_record
    environment:
      hour: 10
  expect: Permit
- name: Nurse reads a patient record at 22:00
  request:
    subject:
      role: nurse
    action: read
    resource:
      type: medical_record
    environment:
      hour: 22
  expect: Deny
- name: Nurse reads a patient record at 22:00 in an emergency
  request:
    subject:
      role: nurse
    action: read
    resource:
      type: medical_record
    environment:
      hour: 22
      emergency: true
  expect: Permit
- name: Nurse tries to prescribe medication
  request:
    subject:
      role: nurse
    action: prescribe
    resource:
      type: prescription
  expect: Deny
- name: Doctor updates a record in their own department
  request:
    subject:
      role: doctor
      department: cardiology
    action: write
    resource:
      type: medical_record
      department: cardiology
  expect: Permit
- name: Doctor updates a record in another department
  request:
    subject:
      role: doctor
      department: cardiology
    action: write
    resource:
      type: medical_record
      department: oncology
  expect: Deny
- name: Billing clerk reads a medical record
  request:
    subject:
      role: billing_clerk
    action: read
    resource:
      type: medical_record
  expect: Deny
- name: Doctor reads psychotherapy notes
  request:
    subject:
      role: doctor
    action: read
    resource:
      sensitivity: psychotherapy
  expect: Deny
- name: Contractor off the corporate network reads a record
  request:
    subject:
      employment_type: contractor
    action: read
    resource:
      type: medical_record
    environment:
      network: public
  expect: Deny
- name: Administrator deletes the audit log
  request:
    subject:
      role: admin
    action: delete
    resource:
      type: audit_log
  expect: Deny
