name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          # macOS runners aren't available to this private repo; re-add once the repo is public:
          # - os: macos-latest
          #   python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install OPA (for Rego differential verification)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (offline - no API key needed)
        run: pytest
      - name: Offline evaluation suite
        run: raivana eval --engine rules
      - name: Demo + differential verification against Cedar and OPA
        run: |
          raivana demo --example hospital
          raivana demo --example bank
          raivana demo --example cloud
